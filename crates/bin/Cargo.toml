[package]
name = "rsopencode"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "AI-powered development tool (Rust)"

[[bin]]
name = "rsopencode"
path = "src/main.rs"

[lib]
name = "rsopencode"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
axum = "0.8"
url = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"
dirs = "5"
rand = "0.8"
regex = "1"
glob = "0.3"
sonar-core = { path = "../../sonar/crates/core" }
ordered-float = "5"
blake3 = "1"
ignore = "0.4"
notify = "7"
model2vec-rs = "0.2"
tree-sitter = "0.25"
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
hex = "0.4"
toml = "0.8"
pulldown-cmark = "0.13.4"
urlencoding = "2.1.3"
unicode-width = "0.2.0"
syntect = "5.3.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
