[workspace]
resolver = "2"
members = ["crates/bin"]
exclude = ["opencode", "sonar"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "AI-powered development tool"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
